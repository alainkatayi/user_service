spring.application.name=user-service
server.port=8080
# Base de données
spring.datasource.url=jdbc:postgresql://localhost:5435/db_user
spring.datasource.username=userapp
spring.datasource.password=userapp

# JPA : Flyway gère le schéma, Hibernate vérifie seulement
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Actuator
management.endpoints.web.exposure.include=health,info

# Coût BCrypt. spring-boot-starter-security n'est pas au classpath : aucun filtre.
app.security.bcrypt-cost=12

# JWT d'accès (RS256) et verrouillage de connexion.
app.jwt.issuer=http://localhost:8080
app.jwt.access-ttl=15m
app.jwt.refresh-ttl=7d
app.jwt.keys-dir=./keys
app.login.max-failed-attempts=5
app.login.lock-duration=15m
app.internal.api-key=dev-internal-key

# Jamais de stack, de SQL ni de nom de classe dans une réponse d'erreur.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.include-exception=false

# Les paramètres SQL contiendraient le hash.
logging.level.org.hibernate.orm.jdbc.bind=off
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=off
