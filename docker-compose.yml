services:
  db_user:
    image: postgres:16
    container_name: db_user
    environment:
      POSTGRES_DB: db_user
      POSTGRES_USER: userapp
      POSTGRES_PASSWORD: userapp
    ports:
      - "5435:5432"
    volumes:
      - db_user_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U userapp -d db_user"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db_user_data: